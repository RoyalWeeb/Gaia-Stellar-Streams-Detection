[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-stellar-streams"
version = "1.0.0"
description = "Reproducible Gaia DR3 UMAP/HDBSCAN candidate-stream pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<4", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2", "astropy>=6,<9", "astroquery>=0.4.7,<0.5",
  "umap-learn>=0.5.6,<0.6", "hdbscan>=0.8.38,<0.9",
  "matplotlib>=3.8,<4", "plotly>=5.20,<7", "PyYAML>=6,<7"
]
[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "nbformat>=5,<6"]
dev = ["pytest>=8,<10"]
dashboard = ["dash>=3.0,<5"]
orbits = ["gala>=1.9,<2"]
report = ["reportlab>=4,<5"]

[project.scripts]
gaia-streams = "stellar_streams.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stellar_streams = ["assets/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
